<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>警犬柯基 · 动作与成长预览</title>
<style>
  :root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#294d7b;background:#eff7ff}
  *{box-sizing:border-box}body{margin:0;padding:22px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.bar a{color:#68419d}.bar button{border:1px solid #d6b64d;border-radius:999px;padding:8px 13px;background:#fffdf8;color:#418bdd;font-weight:700}.bar button:hover{background:#efe2f7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.card{overflow:hidden;border:1px solid #dfd0ed;border-radius:22px;background:#fffdf8;box-shadow:0 12px 28px #418bdd14}.card h2{position:absolute;z-index:3;margin:15px;font-size:17px;background:#fffdf8d9;padding:7px 10px;border-radius:999px}.scene{position:relative;aspect-ratio:960/680;overflow:hidden;background:linear-gradient(#dcedff,#c5e6f6)}.scene>img{position:absolute;width:100%;height:100%;inset:0}.scene .cat{width:calc(53.333% * var(--scale));height:auto;inset:auto;left:50%;bottom:calc(14.412% - 6.176% * var(--scale));transform:translateX(-50%);filter:drop-shadow(0 12px 9px #294d7b28)}.card p{margin:0;padding:12px 15px 15px;color:#6986a6}.atlas{display:block;width:min(100%,900px);margin:12px 0 24px;background:#e7f4f0;border-radius:22px}h1{font-size:26px;margin-top:0}.note{color:#6986a6}
</style>
<h1>警犬柯基 · 15级成长与动作图鉴</h1>
<div class="bar"><a href="../../index.html?test=1">进入游戏测试版 →</a><button data-action="wave">招手</button><button data-action="pet">蹭手</button><button data-action="feed">吃能量餐</button><button data-action="think">思考</button><button data-action="jump">跳跃</button><button data-action="skill">技能</button></div>
<p class="note">每一级都增加新的雷达护盾背景元素并放大体形，Lv.6 / Lv.11 更换进化形态。</p>
<div class="grid" id="grid"></div>
<h1 style="margin-top:30px">三阶段九姿势</h1>
<p class="note">从左到右：待机、眨眼、招呼；蹭手、喂食、思考；睡觉、跳跃、技能。</p>
<h2>见习小警员</h2><img class="atlas" src="assets/stage-1.png" alt="见习小警员九姿势">
<h2>机敏巡逻员</h2><img class="atlas" src="assets/stage-2.png" alt="机敏巡逻员九姿势">
<h2>王牌汪队长</h2><img class="atlas" src="assets/stage-3.png" alt="王牌汪队长九姿势">
<script src="corgi-data.js"></script><script src="corgi-effects.js"></script><script src="corgi.js"></script>
<script>
  const descriptions=CorgiGameData.levels.map(x=>x.description),grid=document.querySelector('#grid');
  CorgiGameData.levels.forEach((item,i)=>{const stage=Math.floor(i/5)+1,article=document.createElement('article');article.className='card';article.innerHTML=`<div class="scene"><h2>Lv.${item.level} · ${item.name}</h2><img src="assets/effects/level-${String(item.level).padStart(2,'0')}.svg" alt=""><img class="cat" style="--scale:${item.scale}" src="assets/stage-${stage}-idle.png" alt="${CorgiGameData.stages[stage-1].name}"></div><p>${descriptions[i]}</p>`;grid.append(article)});
  const demo=document.createElement('corgi-game-pet');demo.setAttribute('level','15');demo.style.cssText='position:fixed;right:14px;bottom:14px;width:min(42vw,360px);height:min(30vw,255px);z-index:9;filter:drop-shadow(0 15px 20px #294d7b33)';document.body.append(demo);
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>demo.play(b.dataset.action));
</script>
</html>
