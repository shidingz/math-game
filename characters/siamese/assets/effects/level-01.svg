<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" aria-hidden="true" data-effect="siamese-thai-1" data-layers="1"><defs><radialGradient id="si-aura"><stop stop-color="#fff0bb" stop-opacity=".1"/><stop offset=".7" stop-color="#43c9c3" stop-opacity=".25"/><stop offset="1" stop-color="#7d50c5" stop-opacity="0"/></radialGradient><linearGradient id="si-curtain" x2="1" y2="1"><stop stop-color="#31c8bd" stop-opacity=".56"/><stop offset=".5" stop-color="#f2c75b" stop-opacity=".15"/><stop offset="1" stop-color="#8f55cf" stop-opacity=".58"/></linearGradient></defs><style>.si-float{animation:si-float 4s ease-in-out infinite}.si-turn{transform-origin:480px 350px;animation:si-turn 50s linear infinite}.si-slow{transform-origin:480px 350px;animation:si-turn 70s linear infinite reverse}.si-fall{animation:si-fall 3.7s ease-in-out infinite}@keyframes si-float{50%{transform:translateY(-8px)}}@keyframes si-turn{to{transform:rotate(360deg)}}@keyframes si-fall{50%{transform:translateY(17px);opacity:.6}}@media(prefers-reduced-motion:reduce){.si-motion{animation:none!important}}</style><g data-unlocked-at="1"><ellipse cx="480" cy="360" rx="210" ry="225" fill="url(#si-aura)"/><g transform="translate(480 596) scale(0.42)" fill="none" stroke="#e5ad38" stroke-width="3"><path d="M0 0Q-14-30 0-49Q14-30 0 0Z"/><path d="M0 0Q-35-20-30-43Q-8-40 0 0Z"/><path d="M0 0Q35-20 30-43Q8-40 0 0Z"/><path d="M0 0Q-42-3-43-25Q-16-28 0 0Z"/><path d="M0 0Q42-3 43-25Q16-28 0 0Z"/></g></g></svg>