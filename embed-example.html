<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悟空组件 · 接入示例</title><style>body{max-width:620px;margin:30px auto;padding:0 20px;font:16px system-ui;color:#29374b;background:#f4f8fc}h1{font-size:23px}p{color:#708299;line-height:1.8;font-size:13px}.scene{background:#eaf6f7;border-radius:24px}button{padding:12px 18px;border:0;border-radius:12px;background:#2e6eae;color:white;font:inherit;cursor:pointer}input{width:90px;padding:12px;border:1px solid #bacadb;border-radius:10px;font:inherit}form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:white;padding:18px;border-radius:18px}a{color:#396d9e}.stats{display:flex;gap:20px;font-size:13px;margin:20px 0}</style><script src="wukong.js" defer></script></head><body><h1>做题，陪悟空一点点长大。</h1><p>这是最小接入示例：答对得 10 点成长值，每 30 点升一级。分数只保留在本页，正式游戏可接入自己的成长规则。</p><div class="scene"><wukong-game-pet id="pet" level="1"></wukong-game-pet></div><div class="stats"><span id="level">Lv.1 小石猴</span><span id="exp">成长值 0 / 30</span></div><form id="quiz"><label for="answer" id="question">3 + 4 =</label><input id="answer" inputmode="numeric" type="number" required autocomplete="off" aria-label="输入答案"><button>提交答案</button><button type="button" id="feed">喂桃子</button></form><p id="message" role="status" aria-live="polite">慢慢想，悟空会陪着你。</p><p><a href="index.html">← 返回完整角色试玩</a></p><script>window.addEventListener('DOMContentLoaded',()=>{
const pet=document.getElementById('pet'),input=document.getElementById('answer'),message=document.getElementById('message');let a=3,b=4,exp=0;
document.getElementById('feed').onclick=()=>pet.play('feed');
input.addEventListener('input',()=>pet.play('think'));
document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();if(input.value.trim()==='')return;if(Number(input.value)!==a+b){pet.play('comfort');message.textContent='没关系，试着把两个数合起来再数一遍。';return;}pet.play('celebrate');message.textContent='答对啦！获得 10 点成长值。';if(pet.level<15){exp+=10;if(exp>=30){exp-=30;pet.level+=1;message.textContent='升级啦！新的成长特效已解锁。';}}else{exp=30;message.textContent='答对啦！大圣为你喝彩。';}document.getElementById('level').textContent=`Lv.${pet.level} ${WukongGameData.stages[pet.stage-1].name}`;document.getElementById('exp').textContent=pet.level===15?'成长圆满':`成长值 ${exp} / 30`;a=1+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*9);document.getElementById('question').textContent=`${a} + ${b} =`;input.value='';input.focus();});
});</script></body></html>
