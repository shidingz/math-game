<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f3f8f4"><title>算算萌宠 · 专属伙伴</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f3f8f4;color:#294941}body{display:flex;flex-direction:column;height:100dvh}button,input{font:inherit}button{border:1px solid #cee0d8;border-radius:12px;background:white;color:#294941;font-weight:650;padding:9px 13px;cursor:pointer}button:hover{background:#e8f4ed}button:disabled{opacity:.55;cursor:wait}.web-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));flex:none;border-bottom:1px solid #e0eae3}.brand{font-size:12px;font-weight:650;line-height:1.5}.brand small{display:block;font-size:10px;font-weight:400;color:#6b7e76}.brand small[data-connected=true]{color:#2a8559}.toolbar-actions{display:flex;gap:6px}.toolbar-actions button{font-size:12px;padding:8px 10px}#open-studio{background:#e0f1e7}#game-canvas{display:block;width:100%;height:100%;min-height:0;flex:1;touch-action:none;outline:none}.photo-picker{position:fixed;left:-10000px;width:1px;height:1px}.web-dialog{border:1px solid #d6e4dc;border-radius:22px;width:min(420px,calc(100vw - 32px));padding:24px;color:#294941;background:#fbfdfb;box-shadow:0 20px 80px #122f3140}.web-dialog::backdrop{background:#183a465e}.web-dialog h2{margin:0 0 14px;font-size:22px}.web-dialog p{font-size:14px;line-height:1.6}.web-dialog label{display:block;font-size:13px;margin:14px 0 6px}.web-dialog input{width:100%;padding:12px;border:1px solid #bacfc3;border-radius:10px;color:#233d35;background:white;font-size:16px}.web-dialog .muted{font-size:12px;color:#687d73}.dialog-error{color:#a34235;min-height:22px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog-actions button:last-child{background:#296c51;color:white}.startup-error{position:absolute;top:100px;left:10%;right:10%;padding:20px;background:#fff1e9;border-radius:16px}
</style></head>
<body><header class="web-toolbar"><div class="brand"><span id="build-mode">算算萌宠</span><small id="service-status">可拍照制作伙伴</small></div><div class="toolbar-actions"><button id="open-studio" type="button">制作伙伴</button><button id="service-connect" type="button">连接服务</button></div></header><canvas id="game-canvas" aria-label="算算萌宠游戏"></canvas><p id="startup-error" class="startup-error" hidden role="alert"></p><script src="web-runtime.js?v=__BUILD_VERSION__"></script></body>
</html>
