<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f3f8f5"><title>算算萌宠 · 专属伙伴</title>
<link rel="stylesheet" href="classic.css?v=__BUILD_VERSION__">
</head>
<body class="classic-web">
<div id="home-shell">
<header class="header"><a class="brand" href="./"><span id="brand-symbol" class="brand-mark" aria-hidden="true">萌</span>算算萌宠</a><div class="wallet" aria-label="我的积分"><span aria-hidden="true">★</span><strong id="points">0</strong><span>积分</span></div></header>
<main class="home">
  <div class="welcome"><div><p class="eyebrow" id="grade-caption">每天进步一点点</p><h1 id="home-title">一起算，一起长大。</h1></div><nav class="partner-nav" aria-label="伙伴与练习"><button id="pets-open" class="unlock-pet" type="button">我的伙伴</button><select id="pet-select" class="pet-select" aria-label="切换伙伴"></select><button id="settings-open" class="grade-switch" type="button"><span id="grade-button">选择年级</span><span aria-hidden="true">⌄</span></button></nav></div>
  <div class="creation-links"><button id="open-studio" type="button">拍照 / 上传，制作伙伴</button><div><small id="service-status">可拍照制作伙伴</small><button id="service-connect" type="button">连接服务</button></div></div>
  <div class="game-layout">
    <section class="pet-card" aria-label="我的宠物"><div class="pet-heading"><div><span id="scene-label" class="eyebrow">伙伴的小天地</span><h2><button id="pet-name" type="button">新伙伴</button><span id="rename-hint">点击改名</span></h2><p id="stage-name"></p></div><span id="level" class="level">Lv.1</span></div>
      <div id="scene-slot" class="pet-scene"><div class="halo" aria-hidden="true"></div><div class="hill hill-one" aria-hidden="true"></div><div class="hill hill-two" aria-hidden="true"></div><p id="speech" class="speech" aria-live="polite">今天也一起成长吧！</p><canvas id="game-canvas" aria-label="伙伴互动，点击和伙伴打招呼" tabindex="0"></canvas><div id="feed-notice" class="feed-notice" role="status" hidden></div><span class="touch-hint">轻轻点我，有小惊喜</span></div>
      <div class="growth"><div class="growth-label"><strong>成长进度</strong><span id="growth-value">0 / 40</span></div><progress id="growth-bar" max="40" value="0" aria-label="宠物成长进度"></progress><p id="evolution-milestones">Lv.6 · 30题　Lv.11 · 100题</p><p id="evolution-hint" class="evolution-hint"></p><p id="evolution-note"></p></div>
    </section>
    <section class="play-panel" aria-label="做题和喂养"><div class="feed-card"><div><p class="eyebrow">喂养会长大</p><h2>陪伙伴长大一点</h2><p>每份增加 20 点成长值</p></div><button id="feed" class="feed-button" type="button"><span id="feed-label">喂养伙伴</span><span id="feed-cost">20 积分</span></button><p id="feed-hint">做对 2 道题，就能喂养一次</p></div>
      <div class="practice-card"><span class="card-icon" aria-hidden="true">＋</span><p class="eyebrow">做题赚积分</p><h2>开动小脑筋</h2><p class="card-copy">答对一题，获得 <strong>10 积分</strong>。<br>不计时，慢慢想也没关系。</p><div class="practice-meta"><span id="mode-label">按年级出题</span><span>每轮 10 题</span></div><button id="start" class="primary" type="button">开始做题 →</button></div>
      <div class="small-note"><p>Lv.6 与 Lv.11 会进化。<br>答题赚积分，喂养让伙伴成长。</p></div>
    </section>
  </div>
  <footer><span id="save-status">进度自动保存在这台设备</span><span id="total-solved">已完成 0 道题</span><div class="footer-actions"><button id="mistakes-open" type="button">错题回顾</button><button id="guide-open" type="button">成长指南</button><button id="debug-open" type="button" hidden>测试工具</button><span id="build-mode"></span></div></footer>
</main></div>
<dialog id="game-dialog" aria-label="游戏操作"><div id="dialog-canvas-slot"></div></dialog>
<p id="startup-error" class="startup-error" hidden role="alert"></p><script src="web-runtime.js?v=__BUILD_VERSION__"></script>
</body></html>
