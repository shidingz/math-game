<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>算算萌宠 · 微信适配预览</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8f5}canvas{width:100%;height:100%;display:block;touch-action:none}.rename-dialog{box-sizing:border-box;border:0;border-radius:24px;padding:26px;width:min(350px,90vw);color:#243c38;box-shadow:0 24px 80px #142d3440;font-family:-apple-system,"PingFang SC",sans-serif}.rename-dialog::backdrop{background:#142d3466}.rename-dialog h2{font-size:22px;margin:0 0 20px}.rename-dialog input{box-sizing:border-box;width:100%;border:1px solid #b9cdc5;border-radius:12px;padding:14px;font-size:18px;outline-color:#548b76}.rename-dialog p{font-size:12px;color:#70857b}.rename-dialog form>div{display:flex;gap:12px;margin-top:24px}.rename-dialog button{flex:1;border:0;border-radius:12px;padding:13px;background:#e9f0ec;color:#37584a;font-size:16px}.rename-dialog button:last-child{background:#47735f;color:white}</style></head><body>
<canvas id="game" aria-label="算算萌宠微信小游戏预览"></canvas>
<script>
// Desktop verification adapter only; this file is excluded from the WeChat package.
const events = {}, canvas = document.getElementById('game');
window.wx = {
  showModal({title,content,placeholderText,confirmText,cancelText,success,complete}) {
    const dialog=document.createElement('dialog');dialog.className='rename-dialog';
    const form=document.createElement('form');form.method='dialog';
    const heading=document.createElement('h2');heading.textContent=title;
    const input=document.createElement('input');input.value=content||'';input.placeholder=placeholderText||'';input.maxLength=48;input.setAttribute('aria-label','伙伴名字');input.autocomplete='off';
    const hint=document.createElement('p');hint.textContent='1—12 个字，名字保存在本机';
    const buttons=document.createElement('div');
    for(const [value,label] of [['cancel',cancelText],['confirm',confirmText]]){const b=document.createElement('button');b.value=value;b.textContent=label;buttons.append(b);}
    form.append(heading,input,hint,buttons);dialog.append(form);document.body.append(dialog);
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();dialog.close('confirm');}});
    dialog.addEventListener('close',()=>{const result={confirm:dialog.returnValue==='confirm',cancel:dialog.returnValue!=='confirm',content:input.value};dialog.remove();success?.(result);complete?.(result);},{once:true});
    dialog.showModal();input.focus();input.select();
  },
  chooseImage({count,sourceType,success,fail}) {
    const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=count>1;
    if(sourceType[0]==='camera') input.capture='environment';
    input.onchange=()=>{const files=Array.from(input.files).slice(0,count); success({tempFilePaths:files.map(f=>URL.createObjectURL(f)),tempFiles:files.map(f=>({size:f.size}))});};
    input.oncancel=()=>fail({errMsg:'chooseImage:fail cancel'}); input.click();
  },
  getFileSystemManager: () => ({saveFile({tempFilePath,success,fail}) {
    fetch(tempFilePath).then(r=>r.blob()).then(blob=>{const reader=new FileReader();reader.onload=()=>success({savedFilePath:reader.result});reader.onerror=fail;reader.readAsDataURL(blob);}).catch(fail);
  }}),
  createCanvas: () => canvas, createImage: () => new Image(),
  getWindowInfo: () => ({ windowWidth: innerWidth, windowHeight: innerHeight, pixelRatio: devicePixelRatio, safeArea: {top: 12, bottom: innerHeight - 10} }),
  getMenuButtonBoundingClientRect: () => ({bottom: 24}),
  getStorageSync: key => localStorage.getItem(key), setStorageSync: (key, value) => localStorage.setItem(key, value),
  getAccountInfoSync: () => ({ miniProgram: { envVersion: 'develop' } }),
  getLaunchOptionsSync: () => ({ query: Object.fromEntries(new URLSearchParams(location.search)) }),
  loadSubpackage: ({success,fail}) => new URLSearchParams(location.search).has('failAssets') ? fail(Error('Simulated network error')) : success(),
  onTouchStart: fn => events.start = fn, onTouchEnd: fn => events.end = fn, onTouchCancel: fn => events.cancel = fn,
  onShow: fn => events.show = fn, onHide: fn => events.hide = fn, onWindowResize: fn => events.resize = fn,
  onMemoryWarning: fn => events.memory = fn
};
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); events.start?.({touches:[{clientX:e.clientX,clientY:e.clientY}]}); });
canvas.addEventListener('pointerup', e => events.end?.({changedTouches:[{clientX:e.clientX,clientY:e.clientY}]}));
canvas.addEventListener('pointercancel', () => events.cancel?.());
document.addEventListener('visibilitychange', () => document.hidden ? events.hide?.() : events.show?.());
window.addEventListener('resize', () => events.resize?.());
window.addEventListener('keydown', e => {
  if(document.querySelector('dialog[open]')) return;
  const game = window.mathPetPreview?.game;
  if (!game || game.screen !== 'quiz') return;
  if (/^[0-9./]$/.test(e.key)) game.key(e.key);
  if (e.key === 'Backspace') game.key('back');
  if (e.key === 'Enter') game.question.status === 'wrong' ? game.advance() : game.submit();
});
</script><script src="preview.js"></script></body></html>
